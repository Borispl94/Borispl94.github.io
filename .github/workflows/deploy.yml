# Publie le portfolio sur GitHub Pages à chaque modification de la branche main.
# Réglage requis une seule fois : Settings → Pages → Source : GitHub Actions.
name: Publier le portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vérifier le contenu
        run: node scripts/verifier.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploiement
        uses: actions/deploy-pages@v4
